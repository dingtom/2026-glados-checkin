name: GLaDOS 2026 Checkin

on:
  # ============================================================================
  # ⏸️ 自动定时签到已暂停（暂停时间：2026-10-08）
  #
  # 为什么要暂停：
  #   合并上游新版认证修复后，2026-10-01 ~ 10-08 连续 9 次定时运行全部失败，
  #   每天早上都会收到一条「签到失败」推送；同时默认的积分自动兑换
  #   （EXCHANGE_PLAN=plan500）在这期间每天扣掉 500 积分。
  #   与其每天重复失败，先停下来把 Cookie / User-Agent 配置确认好。
  #
  # 暂停期间仍可手动运行：在 Actions 页面点 "Run workflow"，
  #   会走下面的 workflow_dispatch 触发器。
  #
  # 如何恢复自动定时签到：把下面 4 行注释去掉，恢复成原来的写法即可 ——
  #     schedule:
  #       # 北京时间 09:30（UTC 01:30）。一天一次即可，脚本会在失败时自动重试。
  #       - cron: '30 1 * * *'
  #
  # schedule:
  #   # 北京时间 09:30（UTC 01:30）。一天一次即可，脚本会在失败时自动重试。
  #   - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || inputs.dispatch_source == 'manual' || inputs.dispatch_source == 'external'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          # Must match the browser that created the current gld:sess.
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'plan500' }}
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
